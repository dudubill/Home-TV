name: Auto Sync IPTV Live

on:
  schedule:
    - cron: '0 22 * * *'
  workflow_dispatch:

# 【核心修复】强行赋予最高写入权限，彻底解决保存报错
permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Multi-Source M3U
        run: |
          mkdir -p live
          
          # 加入 -sL 参数，确保即使源地址重定向也能强行抓取
          curl -sL https://live.fanmingming.com/tv/m3u/ipv6.m3u -o live/ipv6.m3u
          curl -sL https://live.fanmingming.com/tv/m3u/global.m3u -o live/global.m3u
          curl -sL https://live.fanmingming.com/tv/m3u/v6.m3u -o live/sport.m3u
          
      - name: Commit and Push Changes
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add live/
          
          # 防报错逻辑：有更新才提交，没更新直接跳过，绝不报错
          if ! git diff --cached --quiet; then
            git commit -m "Auto Update IPTV Live Sources"
            git push
          else
            echo "源文件未发生变化，无需重复提交。"
          fi
