name: Auto Sync IPTV Live

on:
  schedule:
    - cron: '0 22 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Multi-Source M3U
        run: |
          mkdir -p live
          
          # 1. 国内极速源 (满足：CCTV系列、国内电影频道)
          curl -s https://raw.githubusercontent.com/fanmingming/live/main/tv/m3u/ipv6.m3u -o live/ipv6.m3u
          
          # 2. 港澳台及国际源 (满足：TVB、无线新闻、NOW新闻、凤凰卫视)
          curl -s https://raw.githubusercontent.com/fanmingming/live/main/tv/m3u/global.m3u -o live/global.m3u
          
          # 3. 体育专属源 (满足：NBA直播、五大联赛、CCTV5/5+)
          curl -s https://raw.githubusercontent.com/fanmingming/live/main/tv/m3u/sport.m3u -o live/sport.m3u
          
      - name: Commit and Push Changes
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add live/
          git diff --cached --quiet || (git commit -m "Update All IPTV Live Sources" && git push)
