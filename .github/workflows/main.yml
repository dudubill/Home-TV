name: Auto Sync IPTV Live

on:
  schedule:
    - cron: '0 22 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Multi-Source M3U
        run: |
          mkdir -p live
          
          # 1. 国内极速源 (使用最新的官方加速镜像)
          curl -s https://live.fanmingming.com/tv/m3u/ipv6.m3u -o live/ipv6.m3u
          
          # 2. 港澳台及国际源 
          curl -s https://live.fanmingming.com/tv/m3u/global.m3u -o live/global.m3u
          
          # 3. 央视及体育专属源 
          curl -s https://live.fanmingming.com/tv/m3u/v6.m3u -o live/sport.m3u
          
      - name: Commit and Push Changes
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add live/
          git diff --cached --quiet || (git commit -m "Update All IPTV Live Sources" && git push)
